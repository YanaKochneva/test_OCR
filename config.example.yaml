force_ocr: auto
default_dpi: 300
profile: balanced
gpu: null
offline: true
limits:
  max_file_mb: 200
  max_pages: 300
  max_pixels_per_page: 40000000
  max_dimension_px: 12000
text_layer:
  expected_scripts: [cyrillic, latin]
  min_text_length: 20
  min_expected_script_ratio: 0.35
  max_control_ratio: 0.05
  max_replacement_ratio: 0.01
  max_mixed_script_word_ratio: 0.25
figures:
  padding_px: 8
  merge_iou: 0.2
  min_width_px: 32
  min_height_px: 32
  min_area_ratio: 0.001
  table_fallback_to_figure: true
render:
  include_page_markers: true
  headers_footers: keep
  positional: false
  # External DOCX formatting standard; retains source page geometry and OCR text.
  formatting_reference: null
debug: false
api:
  default_engine: docling
  workers: 1
  max_queue: 16
  max_jobs: 1000
  result_ttl_seconds: 3600
  work_dir: data/jobs
  max_batch_files: 16
  max_batch_mb: 200
  sync_max_pages: 300
  sync_timeout_seconds: 600
  shutdown_timeout_seconds: 300
  # Configure DOCPIPE_API__API_KEY with a secret of at least 32 characters before deployment.
  require_api_key: true
  api_key: null
