# docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.glm-ocr.yml up --build
services:
  docpipe:
    environment:
      DOCPIPE_OFFLINE: "false"
      DOCPIPE_REVIEW__LLM_ENABLED: "true"
      DOCPIPE_REVIEW__PROVIDER: ollama
      DOCPIPE_REVIEW__API_MODEL: docpipe-glm-ocr:latest
      DOCPIPE_REVIEW__OLLAMA_MODE: reread
      DOCPIPE_REVIEW__VISUAL_ENABLED: "false"
      DOCPIPE_REVIEW__OLLAMA_URL: http://host.docker.internal:11434
      DOCPIPE_REVIEW__TIMEOUT_SECONDS: "120"
      DOCPIPE_REVIEW__STAGE_TIMEOUT_SECONDS: "900"
      DOCPIPE_REVIEW__VISUAL_TIMEOUT_SECONDS: "900"
      DOCPIPE_REVIEW__MAX_CALLS: "300"
