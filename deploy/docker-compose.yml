services:
  docpipe:
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 320s
    ports:
      - "127.0.0.1:${DOCPIPE_PORT:-8000}:8000"
    environment:
      DOCPIPE_OFFLINE: "${DOCPIPE_OFFLINE:-true}"
      DOCPIPE_RENDER__DOCX_ENABLED: "false"
      DOCPIPE_RENDER__UNREADABLE_AS_IMAGE: "true"
      DOCPIPE_REVIEW__LLM_ENABLED: "${DOCPIPE_REVIEW_ENABLED:-false}"
      DOCPIPE_REVIEW__VISUAL_ENABLED: "${DOCPIPE_REVIEW_ENABLED:-false}"
      DOCPIPE_REVIEW__PROVIDER: aitunnel
      DOCPIPE_REVIEW__API_MODEL: ${DOCPIPE_REVIEW_MODEL:-gpt-4.1-mini}
      AITUNNEL_API_KEY: ${AITUNNEL_API_KEY:-}
      DOCPIPE_API__DEFAULT_ENGINE: docling
      DOCPIPE_API__WORKERS: "1"
      DOCPIPE_API__REQUIRE_API_KEY: "${DOCPIPE_REQUIRE_API_KEY:-false}"
      DOCPIPE_API__API_KEY: ${DOCPIPE_API_KEY:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=2g,mode=1777
    volumes:
      - docpipe_jobs:/app/data/jobs
volumes:
  docpipe_jobs:
