[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe"
version = "0.1.0"
readme = "README.md"
description = "Конвейер восстановления документов из сканов"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "PyYAML==6.0.3",
  "fastapi==0.128.2",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pypdfium2==5.13.0",
  "pikepdf==10.16.0",
  "reportlab==4.4.9",
  "img2pdf==0.6.3",
  "Pillow==12.3.0",
  "numpy==2.3.5",
  "python-docx==1.2.0",
  "rapidfuzz==3.14.3",
]

[project.optional-dependencies]
nemotron-review = [
  "timm==1.0.22",
  "einops==0.8.1",
  "beautifulsoup4==4.13.3",
  "transformers>=5.14.1,<6",
  "huggingface-hub>=1,<2",
  "requests>=2.32,<3",
  "torch>=2.11",
  "torchvision>=0.26",
  "pymorphy3==2.0.6",
  "pymorphy3-dicts-ru==2.4.417150.4580142",
]
glm-review = ["pymorphy3==2.0.6", "pymorphy3-dicts-ru==2.4.417150.4580142"]
docling = ["docling==2.134.0", "rapidocr==3.9.1", "onnxruntime>=1.20,<2"]
pdf = ["weasyprint==68.0"]

[project.scripts]
docpipe = "docpipe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docpipe = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "api/static/*.html"]
